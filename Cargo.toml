[package]
name = "petplay-mediatransport"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "petplay-media"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
moq-vaapi = { version = "=0.2.1", optional = true }
bytes = "1"
moq-net = "=0.3.10"
moq-tokio = { version = "=0.19.23", default-features = false, features = ["noq", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"] }
url = "2"
data-encoding = "2"
serde_json = "1"
gbm = { version = "0.18", default-features = false, optional = true }

[features]
default = ["encode"]
# The GPU encoder and its DMA-BUF ingestion need a VA-API device. A viewer-only build
# (the `gateway` subcommand) drops them, which is what a non-Linux receiver needs.
encode = ["moq-vaapi"]
iroh = ["moq-tokio/iroh"]
# QUIC qlog traces (MOQ_QUIC_QLOG=DIR), for transport timing analysis.
qlog = ["moq-tokio/qlog"]
# Already encoded input can publish without linking a platform encoder.
publish = []
decode-windows = ["publish", "windows", "iroh"]
# Windows source: one monitor captured with WGC (screen-streamer's petplay-capture crate),
# converted and H.264-encoded on the GPU by Media Foundation, all in this process.
capture-windows = ["publish", "windows", "iroh", "dep:petplay-capture"]
# Linux native receiver: VA-API decode, VPP color conversion, and a GBM output pool.
decode = ["moq-vaapi", "gbm", "iroh"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Ole", "Win32_System_Variant"] }
petplay-capture = { path = "../screen-streamer/capture", optional = true }

# moq-vaapi with H.264 POC type 2 for low-latency hardware decoding; see vendor/moq-vaapi.
[patch.crates-io]
moq-vaapi = { path = "vendor/moq-vaapi" }
