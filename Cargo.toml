[package]
name = "petplay-mediatransport"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "petplay-media"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
moq-vaapi = { version = "=0.2.1", optional = true }
bytes = "1"
moq-net = "=0.3.10"
moq-tokio = { version = "=0.19.23", default-features = false, features = ["noq", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"] }
url = "2"
data-encoding = "2"
serde_json = "1"
gbm = { version = "0.18", default-features = false, optional = true }

[features]
default = ["encode"]
# The GPU encoder and its DMA-BUF ingestion need a VA-API device. A viewer-only build
# (the `gateway` subcommand) drops them, which is what a non-Linux receiver needs.
encode = ["moq-vaapi"]
iroh = ["moq-tokio/iroh"]
# Linux native receiver: VA-API decode, VPP color conversion, and a GBM output pool.
decode = ["moq-vaapi", "gbm", "iroh"]

# moq-vaapi with H.264 POC type 2 for low-latency hardware decoding; see vendor/moq-vaapi.
[patch.crates-io]
moq-vaapi = { path = "vendor/moq-vaapi" }
