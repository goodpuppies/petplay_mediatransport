[package]
name = "petplay-mediatransport"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "petplay-media"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
moq-vaapi = "=0.2.1"
bytes = "1"
moq-net = "=0.3.10"
moq-tokio = { version = "=0.19.23", default-features = false, features = ["noq", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal"] }
url = "2"

[features]
iroh = ["moq-tokio/iroh"]
