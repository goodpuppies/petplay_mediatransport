[package]
name = "petplay-link-web"
version = "0.1.0"
edition = "2024"
description = "Browser side of petplay-media link: an iroh endpoint (relay-only) that dials and accepts stageforge remote connections."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must stay on the iroh version petplay-media links against (through moq-tokio).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
